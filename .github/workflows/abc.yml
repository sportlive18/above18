name: Update Playlist

on:
  schedule:
    - cron: 0 */1 * * *          
  workflow_dispatch:             # manual trigger

jobs:
  generate-playlist:
    runs-on: ubuntu-latest
    permissions:                         # <--- ADD THIS
      contents: write                    # <--- grant push permission

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install Chrome
        run: |
          sudo apt-get update
          sudo apt-get install -y google-chrome-stable

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run sniffer.py
        run: |
          python sniffer.py \
            --models "angela-white,ella-knox,alina-rai,natasha-nice,lena-paul,lana-rhoades,violet-myers,penny-barber,sheena-ryder,ava-addams,comatoss,brandi-love,kayla-kayden,ariella-ferrera" \
            --max 20 \
            --group-title "⭐ Favorites" \
            --headless

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add playlist.m3u playlist.json
          git diff --staged --quiet || git commit -m "Update playlists [skip ci]"
          git push
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
