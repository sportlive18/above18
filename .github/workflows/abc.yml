name: Update Playlists

on:
  schedule:
    # Run daily at a specific time (adjust as needed)
    - cron: '0 0 * * *'
  workflow_dispatch: # Allow manual trigger

permissions:
  contents: write

jobs:
  update-playlists:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Fetch full history to avoid shallow clone issues

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Set up Node.js (if needed)
        uses: actions/setup-node@v4
        with:
          node-version: '18' # Adjust to your Node version

      - name: Install dependencies (if needed)
        run: npm ci
        # Remove this if not using npm

      - name: Update playlists
        run: |
          # Add your playlist update script here
          # Example: node scripts/update-playlists.js
          echo "Updating playlists..."

      - name: Check for changes
        id: verify_changed_files
        run: |
          if git diff-index --quiet HEAD --; then
            echo "changed=false" >> $GITHUB_OUTPUT
          else
            echo "changed=true" >> $GITHUB_OUTPUT
          fi

      - name: Commit changes
        if: steps.verify_changed_files.outputs.changed == 'true'
        run: |
          git add -A
          git commit -m "Update playlists [skip ci]"

      - name: Pull latest changes
        if: steps.verify_changed_files.outputs.changed == 'true'
        run: |
          git pull --rebase origin main || git pull --rebase origin master

      - name: Push changes
        if: steps.verify_changed_files.outputs.changed == 'true'
        run: |
          git push origin main || git push origin master
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Handle push failure with force option (optional)
        if: failure()
        run: |
          # Only use force if absolutely necessary and understand the implications
          git push -u origin main --force-with-lease
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
