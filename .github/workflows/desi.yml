name: Update desi Playlist

on:
  schedule:
    - cron: '0 */6 * * *' # every 6 hours
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'desi.py'

jobs:
  update-playlist:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests pytz

      - name: Run desi.py
        run: |
          python desi.py

      - name: Check generated files
        run: |
          echo "Generated files:"
          ls -lh playlist.m3u playlist.json

          test -f playlist.m3u || {
            echo "ERROR: playlist.m3u was not created"
            exit 1
          }

          test -f playlist.json || {
            echo "ERROR: playlist.json was not created"
            exit 1
          }

      - name: Commit and Push Changes
        run: |
          git config user.name "sportlive18"
          git config user.email "271363488+sportlive18@users.noreply.github.com"

          git add playlist.m3u playlist.json

          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi

          git commit -m "Auto-update JioTV playlists"
          git push origin main
