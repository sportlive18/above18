name: Auto Scraper

on:
  schedule:
    # Runs every 6 hours
    - cron: "0 */6 * * *"
  # Allow manual triggering
  workflow_dispatch:

# Grant permissions for the workflow
permissions:
  contents: write
  actions: read

jobs:
  scrape:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: 'pip'
      
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests beautifulsoup4
      
      - name: Run scraper
        run: python scraper.py
      
      - name: Check for changes
        id: verify_changed
        run: |
          if git diff --quiet; then
            echo "changed=false" >> $GITHUB_OUTPUT
          else
            echo "changed=true" >> $GITHUB_OUTPUT
          fi
      
      - name: Commit and push changes
        if: steps.verify_changed.outputs.changed == 'true'
        run: |
          git config --local user.name "github-actions[bot]"
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git add hitmall.json
          git commit -m "Auto update hitmall.json

Automated commit from GitHub Actions
Triggered by: ${{ github.event_name }}
Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          git push
      
      - name: Log if no changes
        if: steps.verify_changed.outputs.changed == 'false'
        run: echo "No changes detected in hitmall.json"
